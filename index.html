<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AgentWatch</title>
<link id="favicon" rel="icon" href="data:,">
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0c0f;
    --panel: #15171c;
    --panel-2: #1b1e25;
    --line: rgba(255,255,255,.07);
    --text: #f2f3f5;
    --muted: #8b90a0;
    --dim: #5c6170;
    --red: #ff453a;
    --amber: #ffb340;
    --blue: #3f8cff;
    --green: #30d158;
    --radius: 16px;
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", Inter, system-ui, sans-serif;
    --mono: "SF Mono", ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
  body { padding: 0 24px 60px; }
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 18px;
    padding: 18px 0 14px; margin: 0 -24px 18px; padding-left: 24px; padding-right: 24px;
    background: linear-gradient(var(--bg) 70%, transparent);
    backdrop-filter: blur(14px);
  }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.01em; display: flex; align-items: center; gap: 10px; }
  header h1 .logo { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 4px rgba(48,209,88,.18); }
  .counts { display: flex; gap: 8px; }
  .count { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; transition: .25s; }
  .count b { color: var(--text); font-weight: 600; }
  .count i { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .count.waiting.on { border-color: rgba(255,69,58,.45); background: rgba(255,69,58,.1); color: #ffb3ad; }
  .count.waiting.on b { color: #fff; }
  .spacer { flex: 1; }
  .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted); font-size: 12.5px; user-select: none; padding: 6px 10px; border-radius: 10px; border: 1px solid transparent; }
  .toggle:hover { background: var(--panel); border-color: var(--line); }
  .toggle.on { color: var(--text); }
  .toggle .sw { width: 28px; height: 16px; border-radius: 10px; background: #2a2e38; position: relative; transition: .2s; }
  .toggle .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; transition: .2s; }
  .toggle.on .sw { background: var(--green); }
  .toggle.on .sw::after { left: 14px; }
  .conn { font-size: 12px; color: var(--dim); }
  .conn.off { color: var(--red); }

  main { display: grid; gap: 26px; max-width: 1480px; margin: 0 auto; }
  section .ph { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 10px; }
  section .ph h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin: 0; }
  section .ph span { color: var(--dim); font-size: 12px; font-family: var(--mono); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }

  .card {
    position: relative; display: flex; flex-direction: column; gap: 10px;
    padding: 16px 16px 14px; border-radius: var(--radius);
    background: var(--panel); border: 1px solid var(--line);
    cursor: pointer; overflow: hidden;
    transition: transform .25s cubic-bezier(.2,.8,.2,1), border-color .25s, background .25s, box-shadow .25s, opacity .3s;
    animation: in .35s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.98); } }
  .card:hover { transform: translateY(-2px); background: var(--panel-2); border-color: rgba(255,255,255,.14); }
  .card.waiting { border-color: rgba(255,69,58,.5); background: linear-gradient(180deg, rgba(255,69,58,.10), rgba(255,69,58,.03) 60%, var(--panel)); box-shadow: 0 0 0 1px rgba(255,69,58,.15), 0 10px 40px -18px rgba(255,69,58,.6); animation: in .35s both, glow 2.2s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 0 0 1px rgba(255,69,58,.4), 0 10px 50px -14px rgba(255,69,58,.9); } }
  .card.idle { opacity: .72; }
  .card.idle:hover { opacity: 1; }

  .card .top { display: flex; align-items: center; gap: 10px; }
  .dot { position: relative; width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .dot::before { content: ""; position: absolute; inset: 0; border-radius: 50%; }
  .busy .dot { background: var(--blue); }
  .busy .dot::before { background: var(--blue); animation: ping 1.6s cubic-bezier(0,0,.2,1) infinite; }
  .waiting .dot { background: var(--red); }
  .waiting .dot::before { background: var(--red); animation: ping 1.1s cubic-bezier(0,0,.2,1) infinite; }
  .idle .dot { background: #4a4f5c; }
  @keyframes ping { 75%,100% { transform: scale(2.6); opacity: 0; } }
  .ttl { font-weight: 600; font-size: 15px; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .env { font-size: 11px; color: var(--dim); font-family: var(--mono); padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.04); border: 1px solid var(--line); flex: none; }
  .sub { color: var(--muted); font-size: 12px; display: flex; gap: 8px; align-items: center; min-width: 0; }
  .sub .path { font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sub .age { color: var(--dim); flex: none; font-variant-numeric: tabular-nums; }

  .attn { border-radius: 12px; padding: 11px 12px; background: rgba(255,69,58,.12); border: 1px solid rgba(255,69,58,.28); }
  .attn .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: #ff8a80; font-weight: 600; margin-bottom: 5px; display: flex; justify-content: space-between; }
  .attn .k .t { font-family: var(--mono); letter-spacing: 0; text-transform: none; color: #ffb3ad; font-weight: 500; }
  .attn .q { font-size: 14px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; }
  .opts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .opt { font-size: 12px; padding: 4px 9px; border-radius: 8px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.08); color: #e8e9ee; }
  .plan .attn { background: rgba(255,179,64,.12); border-color: rgba(255,179,64,.32); } .plan .attn .k { color: var(--amber); }
  .permission .attn { background: rgba(255,179,64,.12); border-color: rgba(255,179,64,.32); } .permission .attn .k { color: var(--amber); }
  .card.waiting.plan, .card.waiting.permission { border-color: rgba(255,179,64,.5); background: linear-gradient(180deg, rgba(255,179,64,.10), rgba(255,179,64,.03) 60%, var(--panel)); box-shadow: 0 0 0 1px rgba(255,179,64,.15); animation: in .35s both; }
  .card.waiting.plan .dot, .card.waiting.permission .dot { background: var(--amber); } .card.waiting.plan .dot::before, .card.waiting.permission .dot::before { background: var(--amber); }

  .now { display: flex; gap: 9px; align-items: flex-start; color: var(--muted); font-size: 12.5px; min-height: 18px; }
  .now .tool { font-family: var(--mono); color: #9fc2ff; flex: none; }
  .now .txt { overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-word; }
  .busy .bar { height: 2px; border-radius: 2px; background: linear-gradient(90deg, transparent, var(--blue), transparent); background-size: 200% 100%; animation: slide 1.4s linear infinite; margin: -2px 0 0; opacity: .8; }
  @keyframes slide { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .last { color: var(--muted); font-size: 12.5px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; word-break: break-word; white-space: pre-line; }
  .foot { display: flex; align-items: center; gap: 10px; margin-top: 2px; }
  .prompt { color: var(--dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
  .go { flex: none; font: 600 12px var(--font); color: var(--text); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 9px; padding: 6px 11px; cursor: pointer; transition: .15s; }
  .go:hover { background: rgba(255,255,255,.14); }
  .waiting .go { background: var(--red); border-color: transparent; color: #fff; }
  .waiting.plan .go, .waiting.permission .go { background: var(--amber); color: #1a1200; }
  .go:active { transform: scale(.97); }
  .toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; background: #23262e; border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; font-size: 13px; transition: .25s; pointer-events: none; }
  .toast.show { opacity: 1; transform: translateX(-50%); }
  .empty { color: var(--dim); text-align: center; padding: 80px 0; font-size: 15px; }
  @media (max-width: 720px) { body { padding: 0 14px 40px; } header { margin: 0 -14px 14px; padding-left: 14px; padding-right: 14px; flex-wrap: wrap; gap: 10px; } .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1><span class="logo"></span>AgentWatch</h1>
  <div class="counts">
    <span class="count waiting" id="cW"><i style="background:var(--red)"></i><b>0</b> ждут</span>
    <span class="count"><i style="background:var(--blue)"></i><b id="cB">0</b> работают</span>
    <span class="count"><i style="background:#4a4f5c"></i><b id="cI">0</b> свободны</span>
  </div>
  <div class="spacer"></div>
  <label class="toggle" id="tSound"><span class="sw"></span>Звук</label>
  <label class="toggle" id="tNotif"><span class="sw"></span>Уведомления</label>
  <span class="conn" id="conn">подключение…</span>
</header>
<main id="main"><div class="empty">Ищу живые сессии Claude Code…</div></main>
<div class="toast" id="toast"></div>

<script>
const $ = (s, r = document) => r.querySelector(s);
const main = $('#main');
const prefs = { sound: localStorage.aw_sound !== '0', notif: localStorage.aw_notif === '1' };
const seenWaiting = new Map(); // pid -> statusUpdatedAt when we alerted
let snap = { sessions: [] };

// ---- toggles ----
function paintToggles() {
  $('#tSound').classList.toggle('on', prefs.sound);
  $('#tNotif').classList.toggle('on', prefs.notif && Notification.permission === 'granted');
}
$('#tSound').onclick = () => { prefs.sound = !prefs.sound; localStorage.aw_sound = prefs.sound ? '1' : '0'; paintToggles(); if (prefs.sound) beep(); };
$('#tNotif').onclick = async () => {
  if (!prefs.notif) { const p = await Notification.requestPermission(); prefs.notif = p === 'granted'; }
  else prefs.notif = false;
  localStorage.aw_notif = prefs.notif ? '1' : '0'; paintToggles();
};
paintToggles();

// ---- sound ----
let actx;
function beep() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const t = actx.currentTime;
    [[880, 0], [1175, .12]].forEach(([f, d]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0, t + d); g.gain.linearRampToValueAtTime(.18, t + d + .02); g.gain.exponentialRampToValueAtTime(.001, t + d + .35);
      o.connect(g).connect(actx.destination); o.start(t + d); o.stop(t + d + .4);
    });
  } catch {}
}

// ---- helpers ----
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function ago(ts) {
  if (!ts) return '';
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return Math.floor(s) + ' с';
  if (s < 3600) return Math.floor(s / 60) + ' мин';
  if (s < 86400) return Math.floor(s / 3600) + ' ч ' + Math.floor((s % 3600) / 60) + ' м';
  return Math.floor(s / 86400) + ' д';
}
const shortPath = (p) => (p || '').replace(/^\/Users\/[^/]+/, '~');
const envLabel = (e) => e === 'claude-vscode' ? 'VS Code' : e === 'cli' ? 'Terminal' : e || '?';
const rank = (s) => s.status === 'waiting' ? 0 : s.status === 'busy' ? 1 : 2;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); }

async function focus(pid) {
  const r = await fetch('/api/focus/' + pid, { method: 'POST' }).then((r) => r.json()).catch((e) => ({ ok: false, error: String(e) }));
  toast(r.ok ? (r.via === 'vscode' ? 'Открываю в VS Code' : r.result === 'ok' ? 'Переключил вкладку Terminal' : 'Вкладка Terminal не найдена') : 'Ошибка: ' + r.error);
}

// ---- render ----
function cardHTML(s) {
  const t = s.transcript || {};
  const a = s.attention;
  const kind = a ? a.kind : '';
  let body = '';
  if (a) {
    const label = { question: 'Вопрос', permission: 'Разрешение', plan: 'План', input: 'Нужен ответ' }[kind];
    let inner = '';
    if (kind === 'question' && t.question) {
      inner = t.question.map((q) => `<div class="q">${esc(q.question)}</div>` +
        (q.options?.length ? `<div class="opts">${q.options.map((o) => `<span class="opt">${esc(o)}</span>`).join('')}</div>` : '')).join('<div style="height:8px"></div>');
    } else if (kind === 'input' && t.lastAssistantText) {
      inner = `<div class="q">${esc(t.lastAssistantText.slice(0, 400))}</div>`;
    } else {
      inner = `<div class="q">${esc(a.text)}</div>`;
    }
    body = `<div class="attn"><div class="k"><span>${label}</span><span class="t">ждёт ${ago(s.statusUpdatedAt)}</span></div>${inner}</div>`;
  } else if (s.status === 'busy') {
    const pt = t.pendingTool;
    body = `<div class="now">${pt ? `<span class="tool">${esc(pt.name)}</span><span class="txt">${esc(pt.summary)}</span>` : `<span class="txt">${esc((t.lastAssistantText || 'думает…').slice(0, 200))}</span>`}</div><div class="bar"></div>`;
  } else {
    body = `<div class="last">${esc(t.lastAssistantText || 'Готов к задаче')}</div>`;
  }
  return `
    <div class="top"><span class="dot"></span><span class="ttl" title="${esc(s.name)}">${esc(s.title || s.name)}</span><span class="env">${envLabel(s.entrypoint)}</span></div>
    <div class="sub"><span class="path" title="${esc(s.cwd)}">${esc(shortPath(s.cwd))}</span><span class="age">· ${ago(s.updatedAt)} назад</span></div>
    ${body}
    <div class="foot"><span class="prompt" title="${esc(t.lastPrompt)}">${esc(t.lastPrompt ? '› ' + t.lastPrompt : '')}</span><button class="go">Перейти ↗</button></div>`;
}

function render() {
  const list = [...snap.sessions].sort((a, b) => rank(a) - rank(b) || (a.statusUpdatedAt || 0) - (b.statusUpdatedAt || 0));
  const nW = list.filter((s) => s.status === 'waiting').length;
  const nB = list.filter((s) => s.status === 'busy').length;
  const nI = list.length - nW - nB;
  $('#cW b').textContent = nW; $('#cW').classList.toggle('on', nW > 0);
  $('#cB').textContent = nB; $('#cI').textContent = nI;
  document.title = (nW ? `(${nW}) ` : '') + 'AgentWatch';
  favicon(nW, nB);

  if (!list.length) { main.innerHTML = '<div class="empty">Живых сессий Claude Code нет</div>'; return; }

  // groups by project, waiting projects first
  const groups = new Map();
  for (const s of list) { if (!groups.has(s.project)) groups.set(s.project, []); groups.get(s.project).push(s); }
  const order = [...groups.entries()].sort((a, b) => Math.min(...a[1].map(rank)) - Math.min(...b[1].map(rank)) || b[1].length - a[1].length);

  const keep = new Set();
  for (const [proj, ss] of order) {
    let sec = main.querySelector(`section[data-p="${CSS.escape(proj)}"]`);
    if (!sec) { sec = document.createElement('section'); sec.dataset.p = proj; sec.innerHTML = `<div class="ph"><h2>${esc(proj)}</h2><span></span></div><div class="grid"></div>`; }
    main.appendChild(sec); // re-append = reorder
    sec.querySelector('.ph span').textContent = ss.length + (ss.length === 1 ? ' агент' : ss.length < 5 ? ' агента' : ' агентов');
    const grid = sec.querySelector('.grid');
    for (const s of ss) {
      keep.add(s.pid);
      let el = grid.querySelector(`.card[data-pid="${s.pid}"]`);
      if (!el) { el = document.createElement('article'); el.className = 'card'; el.dataset.pid = s.pid; el.onclick = () => focus(s.pid); }
      const cls = `card ${s.status} ${s.attention ? s.attention.kind : ''}`;
      if (el.className !== cls) el.className = cls;
      const html = cardHTML(s);
      if (el._html !== html) { el.innerHTML = html; el._html = html; }
      grid.appendChild(el);
    }
  }
  main.querySelectorAll('.empty').forEach((e) => e.remove());
  main.querySelectorAll('section').forEach((sec) => { if (!groups.has(sec.dataset.p)) sec.remove(); });
  main.querySelectorAll('.card').forEach((c) => { if (!keep.has(Number(c.dataset.pid))) c.remove(); });
}

// ---- alerts on transition to waiting ----
function checkAlerts() {
  for (const s of snap.sessions) {
    if (s.status !== 'waiting') { seenWaiting.delete(s.pid); continue; }
    if (seenWaiting.get(s.pid) === s.statusUpdatedAt) continue;
    seenWaiting.set(s.pid, s.statusUpdatedAt);
    if (!document.hasFocus() || true) {
      if (prefs.sound) beep();
      if (prefs.notif && Notification.permission === 'granted') {
        const n = new Notification(`${s.title || s.name} — ${s.attention?.kind === 'question' ? 'вопрос' : 'ждёт вас'}`, { body: (s.attention?.text || '').slice(0, 180), tag: 'aw-' + s.pid, silent: true });
        n.onclick = () => { window.focus(); focus(s.pid); n.close(); };
      }
    }
  }
}

// ---- favicon ----
function favicon(nW, nB) {
  const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d');
  x.fillStyle = nW ? '#ff453a' : nB ? '#3f8cff' : '#4a4f5c'; x.beginPath(); x.arc(32, 32, 28, 0, Math.PI * 2); x.fill();
  if (nW) { x.fillStyle = '#fff'; x.font = 'bold 36px -apple-system, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(nW), 32, 35); }
  $('#favicon').href = c.toDataURL();
}

// ---- SSE ----
function connect() {
  const es = new EventSource('/events');
  es.onopen = () => { $('#conn').textContent = 'live'; $('#conn').classList.remove('off'); };
  es.onmessage = (e) => { snap = JSON.parse(e.data); render(); checkAlerts(); };
  es.onerror = () => { $('#conn').textContent = 'нет связи с сервером'; $('#conn').classList.add('off'); es.close(); setTimeout(connect, 2000); };
}
connect();
setInterval(render, 10000); // обновлять «N мин назад»
</script>
</body>
</html>
